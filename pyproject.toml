[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dft-agent"
version = "0.4.3"
description = "Run electronic-structure calculations on Slurm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Qirui Cui", email = "qiruic@kth.se"}]
requires-python = ">=3.11"
dependencies = [
    "pymatgen>=2024.11.13,<2027",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "streamlit>=1.65,<2",
    "seekpath>=2.1,<3",
    "paramiko>=3.5,<5; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
]

[project.optional-dependencies]
agent = ["openai>=1.99,<3", "anthropic>=0.86,<2", "keyring>=24,<27"]
desktop = ["pywebview>=6,<7", "openai>=1.99,<3", "anthropic>=0.86,<2", "keyring>=24,<27"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "streamlit>=1.65,<2"]

[project.urls]
Homepage = "https://github.com/cuiqirui99/DFT-AGENT"
Repository = "https://github.com/cuiqirui99/DFT-AGENT"
Documentation = "https://github.com/cuiqirui99/DFT-AGENT/blob/v0.4.3/README.md"
Issues = "https://github.com/cuiqirui99/DFT-AGENT/issues"

[project.scripts]
dft-agent = "vasp_slurm_agent.cli:main"
vasp-agent = "vasp_slurm_agent.cli:main"
dft-agent-desktop = "vasp_slurm_agent.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vasp_slurm_agent = ["examples/*.cif", "examples/*.vasp", "examples/*.json", "knowledge/**/*", "knowledge/*.json", "clusters/*.json", "samples/**/*", "qe_pseudos.json", "qe_nc_pseudos.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
