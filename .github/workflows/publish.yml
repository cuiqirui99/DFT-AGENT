name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.4.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dft-agent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' \
            --pattern 'SHA256SUMS.txt' --pattern 'SHA256SUMS'
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          manifest = dist / "SHA256SUMS.txt"
          if not manifest.is_file():
              manifest = dist / "SHA256SUMS"
          checksums = {}
          for line in manifest.read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              name = name.removeprefix("*")
              if name in checksums:
                  raise SystemExit(f"Duplicate checksum: {name}")
              checksums[name] = digest
          packages = sorted([*dist.glob("*.whl"), *dist.glob("*.tar.gz")])
          if not packages:
              raise SystemExit("No Python packages found")
          for package in packages:
              with package.open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if checksums.get(package.name) != actual:
                  raise SystemExit(f"Missing or incorrect checksum: {package.name}")
              print(f"Verified {package.name}")
          for name in ("SHA256SUMS", "SHA256SUMS.txt"):
              (dist / name).unlink(missing_ok=True)
          PY
      - name: Check the package metadata
        run: |
          python -m pip install --quiet 'twine>=6.1'
          python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
