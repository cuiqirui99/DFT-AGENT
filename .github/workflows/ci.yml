name: Offline checks and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev,agent]" 'ase>=3.23,<4'
      - name: Run offline tests
        run: python -m pytest -q tests validation/reference/test_reference.py
      - name: Build distributions
        run: python -m build
      - name: Verify wheel outside source checkout
        shell: bash
        run: |
          python -m venv /tmp/dft-agent-wheel
          /tmp/dft-agent-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/dft-agent-wheel/bin/dft-agent --help
          /tmp/dft-agent-wheel/bin/dft-agent task --help
          /tmp/dft-agent-wheel/bin/dft-agent continue --help
          /tmp/dft-agent-wheel/bin/dft-agent repair --help
          /tmp/dft-agent-wheel/bin/dft-agent prepare-repair --help
          /tmp/dft-agent-wheel/bin/dft-agent structure-plan --help
          /tmp/dft-agent-wheel/bin/dft-agent prepare-structure --help
          /tmp/dft-agent-wheel/bin/dft-agent convert --help
          /tmp/dft-agent-wheel/bin/dft-agent memory list --query SOC
          /tmp/dft-agent-wheel/bin/vasp-agent --help
          /tmp/dft-agent-wheel/bin/python -c "from vasp_slurm_agent import app, guidance, experience, recovery, structures, structure_agent, task_agent, batch, continuation, qe_workflow, qe_epw, qe_wannier, qe_pairing"
          /tmp/dft-agent-wheel/bin/python - <<'PY'
          from importlib.resources import files
          import json
          from pathlib import Path
          import subprocess
          import tempfile
          from vasp_slurm_agent.config import ClusterConfig
          from vasp_slurm_agent.knowledge import load_catalog, retrieve_knowledge

          memory = load_catalog()
          assert any(item["status"] == "rejected" for item in memory)
          verified = [item for item in memory if item["status"] == "verified"]
          assert verified and all(item["evidence_valid"] for item in verified)
          assert {"succeeded", "failed"} <= {item["outcome"] for item in verified}
          assert retrieve_knowledge("SOC calculation", None)

          examples = files("vasp_slurm_agent").joinpath("examples")
          assert len({item.name.rsplit('.', 1)[0] for item in examples.iterdir()
                      if item.name.endswith(('.cif', '.vasp'))}) == 19
          assert len([item for item in examples.iterdir() if item.name.endswith('.vasp')]) == 10
          assert examples.joinpath("qe-mgb2-stages.json").is_file()
          assert examples.joinpath("sources.json").is_file()
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              source = root / "Si.cif"
              source.write_bytes(files("vasp_slurm_agent").joinpath("examples", "Si.cif").read_bytes())
              config = ClusterConfig(host="cluster.example.invalid", user="researcher",
                  remote_root="/scratch/example", vasp_command="srun vasp_std",
                  potcar_root="/licensed/pbe", partition="cpu")
              config.save(root / "cluster.json")
              subprocess.run(["/tmp/dft-agent-wheel/bin/dft-agent", "prepare", str(source),
                  str(root / "run"), "--config", str(root / "cluster.json")], check=True)
              state = json.loads((root / "run" / "run.json").read_text())
              assert state["status"] == "planned" and state["stages"][0]["job_id"] is None
              assert (root / "run" / "01_relax" / "inputs" / "POSCAR").is_file()
              subprocess.run(["/tmp/dft-agent-wheel/bin/dft-agent", "convert", str(source),
                  str(root / "converted"), "--format", "both"], check=True)
              assert (root / "converted" / "POSCAR").is_file()
              assert (root / "converted" / "edited.cif").is_file()
          PY
